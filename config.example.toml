# Twitch account to mine with. On first start you'll get a code to enter at
# https://www.twitch.tv/activate (shown in the console and in the web UI).
username = "lilb_lxryer"

# Channels to mine, in priority order. They are imported ONCE, on the first start, into the
# database (miner.db next to this file); after that, channels are managed in the web UI (add,
# remove, drag to reorder, star) and this list is ignored. Use a plain name, or a table for
# per-channel overrides:
#   streamers = ["aussienatics", { username = "channel2", follow_raid = false, chat = "NEVER" }]
# `prioritize = true` (or the star in the web UI) makes a channel always take one of the 2 watch
# slots while it's live, ahead of `priority` below - handy for working towards a watch-time badge.
streamers = []

# Claim all claimable drops from your inventory on startup.
claim_drops_startup = false

# How to pick the (max 2) channels watched at the same time, in order of importance.
# ORDER, STREAK, DROPS, SUBSCRIBED, POINTS_ASCENDING, POINTS_DESCENDING
priority = ["STREAK", "DROPS", "ORDER"]

# Watch streaks first: streams where the streak isn't earned yet always take a watch slot first,
# ahead of prioritized (starred) channels and `priority`, until the streak is claimed.
streak_first = false

# Also mine every channel you follow. New follows are added to the end of the list on each start.
# Channels removed in the web UI are blacklisted so they don't come back; `blacklist` here is only
# imported on the first start, like `streamers`.
followers = false
followers_order = "ASC"
blacklist = []

[web]
enabled = true
# Use "0.0.0.0" to reach the UI from other devices. The UI always needs a login token: it's
# generated on first start, printed in the console and saved to `web_token` next to this file.
host = "127.0.0.1"
port = 5000

# Defaults for every channel. Each can be overridden per channel below.
[streamer_defaults]
follow_raid = true
claim_drops = true
claim_moments = true
watch_streak = true
chat = "ONLINE"            # ALWAYS, NEVER, ONLINE, OFFLINE

